<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy Cano | Portfolio Oficial</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #f1f1f1;
            --accent-color: #d4af37;
            --card-bg: #1a1a1a;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: #111;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo img {
            height: 50px;
            object-fit: contain;
        }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }
        nav a:hover {
            color: var(--accent-color);
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('ANDY 1.jpg') no-repeat center center/cover;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .hero p {
            font-size: 1.2rem;
            color: #ccc;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }
        h2 {
            font-size: 2.5rem;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
            padding-bottom: 10px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .gallery-item {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        .gallery-item img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }
        .epk-section {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            margin-top: 60px;
        }
        .epk-section img {
            max-width: 400px;
            width: 100%;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #e6c547;
        }
        footer {
            text-align: center;
            padding: 40px;
            background: #111;
            color: #777;
            border-top: 1px solid #333;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Andy Cano Logo">
        </div>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#galeria">Galería</a>
            <a href="#epk">EPK</a>
        </nav>
    </header>

    <section id="inicio" class="hero">
        <h1>Andy Cano</h1>
        <p>Portfolio Oficial • Artista Visual</p>
    </section>

    <div class="container" id="galeria">
        <div class="section-title">
            <h2>Galería</h2>
        </div>
        <div class="gallery">
            <div class="gallery-item">
                <img src="ANDY 1.jpg" alt="Andy Cano 1">
            </div>
            <div class="gallery-item">
                <img src="Captura.PNG" alt="Captura">
            </div>
            <div class="gallery-item">
                <img src="2.png" alt="Obra 2">
            </div>
            <div class="gallery-item">
                <img src="3.png" alt="Obra 3">
            </div>
            <div class="gallery-item">
                <img src="4.png" alt="Obra 4">
            </div>
            <div class="gallery-item">
                <img src="861544152_122095139469526673_294096232183297714_n.jpg" alt="Obra 6">
            </div>
        </div>

        <div class="epk-section" id="epk">
            <h2>EPK / Dossier</h2>
            <p>Conoce la trayectoria y propuesta artística.</p>
            <br>
            <img src="EPK_SOY_ANDY_CANO.pdf.png" alt="EPK Andy Cano">
            <br><br>
            <a href="EPK_SOY_ANDY_CANO.pdf.png" target="_blank" class="btn">Ver Imagen Completa</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Andy Cano. Diseñado por Pulsar Digital Group. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
